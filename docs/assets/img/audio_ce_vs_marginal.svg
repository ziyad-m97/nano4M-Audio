<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img"
     aria-label="Bar chart comparing the EnCodec codebook marginal entropy of 6.2 nats against the final audio validation cross-entropy of 5.2 nats, a gap of about 1.0 nat of learned conditional structure per audio token. A dashed line marks the uniform-codebook bound, log 2048 equals 7.62 nats.">
  <style>
    .s{font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .ax{font-size:12px;fill:#777}
    .val{font-size:17px;font-weight:700}
    .lab{font-size:13px;font-weight:600;fill:#333}
    .note{font-size:11px;fill:#888}
    .gap{font-size:12px;font-weight:700;fill:#2e3f52}
  </style>
  <defs>
    <marker id="d2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7 z" fill="#2e3f52"/></marker>
    <marker id="u2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M7,1 L1,4 L7,7 z" fill="#2e3f52"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="430" fill="#ffffff"/>

  <!-- axes -->
  <line x1="80" y1="40" x2="80" y2="360" stroke="#ccc" stroke-width="1.5"/>
  <line x1="80" y1="360" x2="520" y2="360" stroke="#ccc" stroke-width="1.5"/>
  <g class="s ax" text-anchor="end">
    <text x="70" y="364">0</text><line x1="76" y1="360" x2="80" y2="360" stroke="#ccc"/>
    <text x="70" y="284">2</text><line x1="76" y1="280" x2="80" y2="280" stroke="#ccc"/>
    <text x="70" y="204">4</text><line x1="76" y1="200" x2="80" y2="200" stroke="#ccc"/>
    <text x="70" y="124">6</text><line x1="76" y1="120" x2="80" y2="120" stroke="#ccc"/>
  </g>
  <text class="s ax" x="26" y="200" transform="rotate(-90 26 200)" text-anchor="middle">cross-entropy (nats)</text>

  <!-- uniform codebook bound -->
  <line x1="100" y1="55.2" x2="470" y2="55.2" stroke="#c44" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text class="s note" x="100" y="49" fill="#c44">uniform codebook · log 2048 = 7.62</text>

  <!-- marginal bar -->
  <rect x="150" y="112" width="100" height="248" rx="3" fill="#b9bfc6"/>
  <text class="s val" x="200" y="104" text-anchor="middle" fill="#5e6a76">6.2</text>
  <!-- CE bar -->
  <rect x="330" y="152" width="100" height="208" rx="3" fill="#42648a"/>
  <text class="s val" x="380" y="144" text-anchor="middle" fill="#42648a">5.2</text>

  <!-- gap annotation -->
  <line x1="250" y1="112" x2="448" y2="112" stroke="#9aa0a6" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="448" y1="112" x2="448" y2="152" stroke="#2e3f52" stroke-width="1.6" marker-start="url(#d2)" marker-end="url(#u2)"/>
  <text class="s gap" x="456" y="128">≈ 1.0 nat</text>
  <text class="s gap" x="456" y="143" font-weight="600" font-size="11">conditional</text>
  <text class="s gap" x="456" y="156" font-weight="600" font-size="11">structure</text>

  <!-- x labels -->
  <text class="s lab" x="200" y="382" text-anchor="middle">Marginal entropy</text>
  <text class="s note" x="200" y="398" text-anchor="middle">predict from token frequencies</text>
  <text class="s lab" x="380" y="382" text-anchor="middle">Final audio CE</text>
  <text class="s note" x="380" y="398" text-anchor="middle">our trained model</text>

  <text class="s note" x="300" y="420" text-anchor="middle">Lower cross-entropy = more predictive. The model beats the marginal by ≈1 nat per token.</text>
</svg>
