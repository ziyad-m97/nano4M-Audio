<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 210" role="img"
     aria-label="Dataset construction pipeline: raw clips from AudioSet and VGGSound pass a PANNs audio filter (score at least 0.30), a CLIP image-text filter (cosine at least 0.25), and a Silero voice-activity filter that removes human speech, then are tokenized across five modalities, yielding 9,192 clips over 11 animal classes with an 80/10/10 clip-level split.">
  <style>
    .s{font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .t{font-size:14px;font-weight:700;fill:#1a1a1a}
    .sub{font-size:10.5px;fill:#6b6b6b}
    .end{font-size:12.5px;font-weight:700;fill:#2e3f52}
  </style>
  <defs><marker id="dp" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 z" fill="#9aa0a6"/></marker></defs>
  <rect x="0" y="0" width="1040" height="210" fill="#ffffff"/>

  <!-- box 1 raw -->
  <rect x="16" y="28" width="176" height="104" rx="9" fill="#fff" stroke="#e4e4dd" stroke-width="1.5"/>
  <g fill="#9aa0a6"><rect x="86" y="46" width="36" height="24" rx="3"/><rect x="92" y="40" width="36" height="24" rx="3" fill="#bcc2c8"/><rect x="98" y="34" width="36" height="24" rx="3" fill="#d6dadf"/></g>
  <text class="s t" x="104" y="98" text-anchor="middle">Raw clips</text>
  <text class="s sub" x="104" y="115" text-anchor="middle">AudioSet + VGGSound</text>
  <line x1="192" y1="80" x2="220" y2="80" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#dp)"/>

  <!-- box 2 PANNs -->
  <rect x="224" y="28" width="176" height="104" rx="9" fill="#fff" stroke="#d3dae1" stroke-width="1.5"/>
  <polyline points="288,58 298,44 306,68 314,40 322,66 332,50 340,58" fill="none" stroke="#42648a" stroke-width="2"/>
  <text class="s t" x="312" y="98" text-anchor="middle">PANNs filter</text>
  <text class="s sub" x="312" y="115" text-anchor="middle">audio score ≥ 0.30</text>
  <line x1="400" y1="80" x2="428" y2="80" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#dp)"/>

  <!-- box 3 CLIP -->
  <rect x="432" y="28" width="176" height="104" rx="9" fill="#fff" stroke="#d3dae1" stroke-width="1.5"/>
  <circle cx="520" cy="54" r="13" fill="none" stroke="#9a9a92" stroke-width="2.4"/><circle cx="520" cy="54" r="4.5" fill="#9a9a92"/>
  <text class="s t" x="520" y="98" text-anchor="middle">CLIP filter</text>
  <text class="s sub" x="520" y="115" text-anchor="middle">img–text cos ≥ 0.25</text>
  <line x1="608" y1="80" x2="636" y2="80" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#dp)"/>

  <!-- box 4 VAD -->
  <rect x="640" y="28" width="176" height="104" rx="9" fill="#fff" stroke="#d3dae1" stroke-width="1.5"/>
  <g><rect x="722" y="42" width="13" height="22" rx="6" fill="#c44"/><rect x="715" y="64" width="27" height="4" rx="2" fill="#c44"/><line x1="712" y1="40" x2="746" y2="70" stroke="#c44" stroke-width="2.4"/></g>
  <text class="s t" x="728" y="98" text-anchor="middle">Silero VAD</text>
  <text class="s sub" x="728" y="115" text-anchor="middle">no human speech</text>
  <line x1="816" y1="80" x2="844" y2="80" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#dp)"/>

  <!-- box 5 tokenize -->
  <rect x="848" y="28" width="176" height="104" rx="9" fill="#eef1f4" stroke="#42648a" stroke-width="1.5"/>
  <g><rect x="906" y="42" width="12" height="12" rx="2" fill="#9a9a92"/><rect x="920" y="42" width="12" height="12" rx="2" fill="#42648a"/><rect x="934" y="42" width="12" height="12" rx="2" fill="#9a9a92"/><rect x="906" y="56" width="12" height="12" rx="2" fill="#9a9a92"/><rect x="920" y="56" width="12" height="12" rx="2" fill="#9a9a92"/><rect x="934" y="56" width="12" height="12" rx="2" fill="#9aa0a6"/></g>
  <text class="s t" x="936" y="98" text-anchor="middle" fill="#2e3f52">Tokenize</text>
  <text class="s sub" x="936" y="115" text-anchor="middle">5 modalities · 10 frames/clip</text>

  <!-- end annotation -->
  <text class="s end" x="520" y="172" text-anchor="middle">→ 9,192 clips · 11 animal classes · 80 / 10 / 10 clip-level split (7,347 / 907 / 938)</text>
  <text class="s sub" x="520" y="190" text-anchor="middle">depth pseudo-labels: Depth-Anything-V2 · normals: DSINE (per-frame)</text>
</svg>
