<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" role="img"
     aria-label="The nano4M-Audio architecture: five tokenized modality streams (RGB, audio, depth, surface normals, caption) feed a single shared encoder-decoder transformer and are reconstructed as targets. Audio uses span masking; the other modalities use random Dirichlet masking.">
  <style>
    .s{font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .serif{font-family:'Crimson Pro',Georgia,'Times New Roman',serif}
    .name{font-size:15px;font-weight:600;fill:#1A1A1A}
    .tok{font-size:10.5px;font-style:italic;fill:#6b6b6b}
    .hdr{font-size:12px;font-weight:700;fill:#9a9a92;letter-spacing:1.6px}
    .blklab{font-size:15px;font-weight:700;fill:#0b3a6b}
    .blksub{font-size:10.5px;fill:#3d6a99}
    .pill{font-size:9px;font-weight:700;fill:#fff}
    .pillg{font-size:9px;font-weight:600;fill:#fff}
    .cap{font-size:11px;fill:#555}
    .quote{font-size:12px;font-style:italic;fill:#7a6300}
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="540" fill="#ffffff"/>

  <!-- column headers -->
  <text class="s hdr" x="136" y="48" text-anchor="middle">INPUTS</text>
  <text class="s hdr" x="520" y="48" text-anchor="middle">SHARED TRANSFORMER</text>
  <text class="s hdr" x="904" y="48" text-anchor="middle">TARGETS</text>

  <!-- ============ INPUT CARDS ============ -->
  <!-- generated rows: top y = 70,148,226,304,382 ; h=62 -->
  <!-- RGB -->
  <g>
    <rect x="24" y="70" width="224" height="62" rx="8" fill="#fff" stroke="#e4e4dd" stroke-width="1.5"/>
    <rect x="24" y="70" width="7" height="62" rx="3.5" fill="#E0742F"/>
    <text class="s name" x="44" y="97">RGB</text>
    <text class="s tok" x="44" y="115">4M-16k DiVAE · 196</text>
    <g fill="#E0742F"><rect x="150" y="92" width="13" height="13" rx="2"/><rect x="168" y="92" width="13" height="13" rx="2" opacity=".8"/><rect x="186" y="92" width="13" height="13" rx="2" opacity=".62"/><rect x="204" y="92" width="13" height="13" rx="2" opacity=".8"/><rect x="222" y="92" width="13" height="13" rx="2" opacity=".5"/></g>
  </g>
  <!-- Audio -->
  <g>
    <rect x="24" y="148" width="224" height="62" rx="8" fill="#fff" stroke="#bcd4f2" stroke-width="2"/>
    <rect x="24" y="148" width="7" height="62" rx="3.5" fill="#1F6FEB"/>
    <text class="s name" x="44" y="175">Audio</text>
    <text class="s tok" x="44" y="193">EnCodec 24k · 512</text>
    <g fill="#1F6FEB"><rect x="150" y="170" width="13" height="13" rx="2" opacity=".55"/><rect x="168" y="170" width="13" height="13" rx="2"/><rect x="186" y="170" width="13" height="13" rx="2" opacity=".7"/><rect x="204" y="170" width="13" height="13" rx="2" opacity=".9"/><rect x="222" y="170" width="13" height="13" rx="2" opacity=".6"/></g>
  </g>
  <!-- Depth -->
  <g>
    <rect x="24" y="226" width="224" height="62" rx="8" fill="#fff" stroke="#e4e4dd" stroke-width="1.5"/>
    <rect x="24" y="226" width="7" height="62" rx="3.5" fill="#2E8B57"/>
    <text class="s name" x="44" y="253">Depth</text>
    <text class="s tok" x="44" y="271">4M-8k DiVAE · 196</text>
    <g fill="#2E8B57"><rect x="150" y="248" width="13" height="13" rx="2" opacity=".8"/><rect x="168" y="248" width="13" height="13" rx="2" opacity=".55"/><rect x="186" y="248" width="13" height="13" rx="2"/><rect x="204" y="248" width="13" height="13" rx="2" opacity=".7"/><rect x="222" y="248" width="13" height="13" rx="2" opacity=".85"/></g>
  </g>
  <!-- Normals -->
  <g>
    <rect x="24" y="304" width="224" height="62" rx="8" fill="#fff" stroke="#e4e4dd" stroke-width="1.5"/>
    <rect x="24" y="304" width="7" height="62" rx="3.5" fill="#8E44AD"/>
    <text class="s name" x="44" y="331">Normals</text>
    <text class="s tok" x="44" y="349">4M-8k DiVAE · 196</text>
    <g fill="#8E44AD"><rect x="150" y="326" width="13" height="13" rx="2" opacity=".7"/><rect x="168" y="326" width="13" height="13" rx="2" opacity=".9"/><rect x="186" y="326" width="13" height="13" rx="2" opacity=".55"/><rect x="204" y="326" width="13" height="13" rx="2"/><rect x="222" y="326" width="13" height="13" rx="2" opacity=".75"/></g>
  </g>
  <!-- Caption -->
  <g>
    <rect x="24" y="382" width="224" height="62" rx="8" fill="#fff" stroke="#e4e4dd" stroke-width="1.5"/>
    <rect x="24" y="382" width="7" height="62" rx="3.5" fill="#C9A227"/>
    <text class="s name" x="44" y="409">Caption</text>
    <text class="s tok" x="44" y="427">GPT-2 BPE</text>
    <text class="serif quote" x="150" y="418" font-size="11">“a photo of a dog”</text>
  </g>

  <!-- input -> encoder arrows + mask pills (x mid 289) -->
  <g stroke="#c4c9ce" stroke-width="1.6" fill="none">
    <line x1="248" y1="101" x2="328" y2="101" marker-end="url(#ah)"/>
    <line x1="248" y1="179" x2="328" y2="179" marker-end="url(#ah)" stroke="#1F6FEB"/>
    <line x1="248" y1="257" x2="328" y2="257" marker-end="url(#ah)"/>
    <line x1="248" y1="335" x2="328" y2="335" marker-end="url(#ah)"/>
    <line x1="248" y1="413" x2="328" y2="413" marker-end="url(#ah)"/>
  </g>
  <!-- mask pills -->
  <g>
    <rect x="263" y="92" width="50" height="16" rx="8" fill="#b6bcc2"/><text class="s pillg" x="288" y="103" text-anchor="middle">random</text>
    <rect x="261" y="170" width="54" height="16" rx="8" fill="#1F6FEB"/><text class="s pill" x="288" y="181" text-anchor="middle">span mask</text>
    <rect x="263" y="248" width="50" height="16" rx="8" fill="#b6bcc2"/><text class="s pillg" x="288" y="259" text-anchor="middle">random</text>
    <rect x="263" y="326" width="50" height="16" rx="8" fill="#b6bcc2"/><text class="s pillg" x="288" y="337" text-anchor="middle">random</text>
    <rect x="263" y="404" width="50" height="16" rx="8" fill="#b6bcc2"/><text class="s pillg" x="288" y="415" text-anchor="middle">random</text>
  </g>

  <!-- ============ ENCODER / DECODER ============ -->
  <rect x="330" y="70" width="150" height="374" rx="10" fill="#eef4fc" stroke="#1F6FEB" stroke-width="1.5"/>
  <rect x="560" y="70" width="150" height="374" rx="10" fill="#eef4fc" stroke="#1F6FEB" stroke-width="1.5"/>
  <text class="s blklab" x="405" y="100" text-anchor="middle">Encoder</text>
  <text class="s blklab" x="635" y="100" text-anchor="middle">Decoder</text>
  <g stroke="#c5d8f3" stroke-width="2">
    <line x1="352" y1="120" x2="458" y2="120"/><line x1="352" y1="140" x2="458" y2="140"/><line x1="352" y1="160" x2="458" y2="160"/><line x1="352" y1="180" x2="458" y2="180"/><line x1="352" y1="200" x2="458" y2="200"/><line x1="352" y1="220" x2="458" y2="220"/>
    <line x1="582" y1="120" x2="688" y2="120"/><line x1="582" y1="140" x2="688" y2="140"/><line x1="582" y1="160" x2="688" y2="160"/><line x1="582" y1="180" x2="688" y2="180"/><line x1="582" y1="200" x2="688" y2="200"/><line x1="582" y1="220" x2="688" y2="220"/>
  </g>
  <text class="s blksub" x="405" y="424" text-anchor="middle">d6 · w512</text>
  <text class="s blksub" x="635" y="424" text-anchor="middle">d6 · w512</text>

  <!-- cross attention -->
  <g stroke="#1F6FEB" stroke-width="1.8" fill="none">
    <line x1="482" y1="251" x2="558" y2="251" marker-end="url(#ah)"/>
    <line x1="558" y1="263" x2="482" y2="263" marker-end="url(#ah)"/>
  </g>
  <text class="s" x="520" y="240" text-anchor="middle" font-size="10" fill="#3d6a99">cross-attention</text>

  <!-- decoder -> output arrows -->
  <g stroke="#c4c9ce" stroke-width="1.6" fill="none">
    <line x1="710" y1="101" x2="790" y2="101" marker-end="url(#ah)"/>
    <line x1="710" y1="179" x2="790" y2="179" marker-end="url(#ah)" stroke="#1F6FEB"/>
    <line x1="710" y1="257" x2="790" y2="257" marker-end="url(#ah)"/>
    <line x1="710" y1="335" x2="790" y2="335" marker-end="url(#ah)"/>
    <line x1="710" y1="413" x2="790" y2="413" marker-end="url(#ah)"/>
  </g>

  <!-- ============ OUTPUT CARDS ============ (dashed = generated) -->
  <g>
    <rect x="792" y="70" width="224" height="62" rx="8" fill="#fcfbf9" stroke="#E0742F" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text class="s name" x="812" y="97">RGB</text><text class="s tok" x="812" y="115">predicted tokens</text>
    <g fill="#E0742F"><rect x="918" y="92" width="13" height="13" rx="2" opacity=".75"/><rect x="936" y="92" width="13" height="13" rx="2" opacity=".55"/><rect x="954" y="92" width="13" height="13" rx="2" opacity=".85"/><rect x="972" y="92" width="13" height="13" rx="2" opacity=".6"/><rect x="990" y="92" width="13" height="13" rx="2" opacity=".8"/></g>
  </g>
  <g>
    <rect x="792" y="148" width="224" height="62" rx="8" fill="#fcfbf9" stroke="#1F6FEB" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text class="s name" x="812" y="175">Audio</text><text class="s tok" x="812" y="193">predicted tokens</text>
    <g fill="#1F6FEB"><rect x="918" y="170" width="13" height="13" rx="2" opacity=".7"/><rect x="936" y="170" width="13" height="13" rx="2" opacity=".7"/><rect x="954" y="170" width="13" height="13" rx="2" opacity=".7"/><rect x="972" y="170" width="13" height="13" rx="2" opacity=".7"/><rect x="990" y="170" width="13" height="13" rx="2" opacity=".7"/></g>
  </g>
  <g>
    <rect x="792" y="226" width="224" height="62" rx="8" fill="#fcfbf9" stroke="#2E8B57" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text class="s name" x="812" y="253">Depth</text><text class="s tok" x="812" y="271">predicted tokens</text>
    <g fill="#2E8B57"><rect x="918" y="248" width="13" height="13" rx="2" opacity=".8"/><rect x="936" y="248" width="13" height="13" rx="2" opacity=".6"/><rect x="954" y="248" width="13" height="13" rx="2" opacity=".9"/><rect x="972" y="248" width="13" height="13" rx="2" opacity=".7"/><rect x="990" y="248" width="13" height="13" rx="2" opacity=".55"/></g>
  </g>
  <g>
    <rect x="792" y="304" width="224" height="62" rx="8" fill="#fcfbf9" stroke="#8E44AD" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text class="s name" x="812" y="331">Normals</text><text class="s tok" x="812" y="349">predicted tokens</text>
    <g fill="#8E44AD"><rect x="918" y="326" width="13" height="13" rx="2" opacity=".7"/><rect x="936" y="326" width="13" height="13" rx="2" opacity=".85"/><rect x="954" y="326" width="13" height="13" rx="2" opacity=".6"/><rect x="972" y="326" width="13" height="13" rx="2" opacity=".9"/><rect x="990" y="326" width="13" height="13" rx="2" opacity=".7"/></g>
  </g>
  <g>
    <rect x="792" y="382" width="224" height="62" rx="8" fill="#fcfbf9" stroke="#C9A227" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text class="s name" x="812" y="409">Caption</text>
    <text class="serif quote" x="812" y="431" font-size="11">“a photo of a dog”</text>
  </g>

  <!-- bottom caption band -->
  <line x1="24" y1="478" x2="1016" y2="478" stroke="#ececE4" stroke-width="1.5"/>
  <text class="s cap" x="520" y="500" text-anchor="middle">Single shared encoder–decoder · d6-6w512 (~96M params) · unified 50,304-token vocabulary · additive modality + position embeddings · per-modality length-normalized loss</text>
  <text class="s cap" x="520" y="518" text-anchor="middle" fill="#777">No architectural change is added for audio — the only new ingredient is contiguous <tspan fill="#1F6FEB" font-weight="700">span masking</tspan> on the temporal audio stream.</text>
</svg>
