<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Placeholder for the caption-to-RGB generation gallery: a caption label above each generated image across eight samples.">
  <style>
    .s{font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .badge{font-size:12px;font-weight:700;fill:#b07d2b}
    .chip{font-size:11px;font-weight:600;fill:#555}
  </style>
  <rect x="0" y="0" width="1200" height="320" fill="#fbfbf8" stroke="#dcdcd2" stroke-width="2" stroke-dasharray="9 6" rx="10"/>
  <rect x="24" y="16" width="410" height="26" rx="13" fill="#fdf3df"/>
  <text class="s badge" x="38" y="34">PLACEHOLDER · assets/img/caption2rgb_gallery.png</text>
  <text class="s chip" x="1176" y="34" text-anchor="end">caption “a photo of a &lt;class&gt;” → generated RGB</text>

  <!-- 8 columns -->
  <g>
    <!-- caption chips row -->
    <g class="s chip" text-anchor="middle">
      <text x="104" y="86">dog</text><text x="244" y="86">cat</text><text x="384" y="86">cow</text><text x="524" y="86">pig</text><text x="664" y="86">sheep</text><text x="804" y="86">horse</text><text x="944" y="86">duck</text><text x="1084" y="86">lion</text>
    </g>
    <!-- generated tiles -->
    <g fill="#eceae3" stroke="#dcdcd2">
      <rect x="40" y="100" width="128" height="160" rx="4"/><rect x="180" y="100" width="128" height="160" rx="4"/><rect x="320" y="100" width="128" height="160" rx="4"/><rect x="460" y="100" width="128" height="160" rx="4"/><rect x="600" y="100" width="128" height="160" rx="4"/><rect x="740" y="100" width="128" height="160" rx="4"/><rect x="880" y="100" width="128" height="160" rx="4"/><rect x="1020" y="100" width="128" height="160" rx="4"/>
    </g>
    <g fill="#c9c7bd" font-size="22" text-anchor="middle">
      <text x="104" y="188">▦</text><text x="244" y="188">▦</text><text x="384" y="188">▦</text><text x="524" y="188">▦</text><text x="664" y="188">▦</text><text x="804" y="188">▦</text><text x="944" y="188">▦</text><text x="1084" y="188">▦</text>
    </g>
  </g>
  <text class="s chip" x="600" y="298" text-anchor="middle" fill="#9a9a92">Drop the notebook export here as caption2rgb_gallery.png — it will replace this placeholder automatically.</text>
</svg>
