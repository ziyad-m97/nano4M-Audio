<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Placeholder for the structural reconstruction gallery: rows of RGB input, predicted depth, and predicted surface normals across six test samples.">
  <style>
    .s{font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .rl{font-size:14px;font-weight:700;fill:#555}
    .badge{font-size:12px;font-weight:700;fill:#b07d2b}
    .cl{font-size:11px;fill:#9a9a92}
  </style>
  <rect x="0" y="0" width="1200" height="600" fill="#fbfbf8" stroke="#dcdcd2" stroke-width="2" stroke-dasharray="9 6" rx="10"/>
  <rect x="24" y="18" width="430" height="26" rx="13" fill="#fdf3df"/>
  <text class="s badge" x="38" y="36">PLACEHOLDER · assets/img/reconstruction_gallery.png</text>

  <!-- column heads -->
  <g class="s cl" text-anchor="middle">
    <text x="210" y="64">dog</text><text x="382" y="64">cat</text><text x="554" y="64">cow</text><text x="726" y="64">pig</text><text x="898" y="64">sheep</text><text x="1070" y="64">horse</text>
  </g>
  <!-- row labels -->
  <text class="s rl" x="60" y="160" text-anchor="middle" transform="rotate(-90 60 160)">RGB input</text>
  <text class="s rl" x="60" y="335" text-anchor="middle" transform="rotate(-90 60 335)">Depth</text>
  <text class="s rl" x="60" y="510" text-anchor="middle" transform="rotate(-90 60 510)">Normals</text>

  <!-- tiles: 3 rows x 6 cols -->
  <g fill="#eceae3" stroke="#dcdcd2">
    <!-- row1 y=80 -->
    <rect x="124" y="80" width="172" height="160" rx="4"/><rect x="296" y="80" width="172" height="160" rx="4"/><rect x="468" y="80" width="172" height="160" rx="4"/><rect x="640" y="80" width="172" height="160" rx="4"/><rect x="812" y="80" width="172" height="160" rx="4"/><rect x="984" y="80" width="172" height="160" rx="4"/>
    <!-- row2 y=255 -->
    <rect x="124" y="255" width="172" height="160" rx="4"/><rect x="296" y="255" width="172" height="160" rx="4"/><rect x="468" y="255" width="172" height="160" rx="4"/><rect x="640" y="255" width="172" height="160" rx="4"/><rect x="812" y="255" width="172" height="160" rx="4"/><rect x="984" y="255" width="172" height="160" rx="4"/>
    <!-- row3 y=430 -->
    <rect x="124" y="430" width="172" height="160" rx="4"/><rect x="296" y="430" width="172" height="160" rx="4"/><rect x="468" y="430" width="172" height="160" rx="4"/><rect x="640" y="430" width="172" height="160" rx="4"/><rect x="812" y="430" width="172" height="160" rx="4"/><rect x="984" y="430" width="172" height="160" rx="4"/>
  </g>
  <g fill="#c9c7bd" font-family="Inter,sans-serif" font-size="22" text-anchor="middle">
    <text x="210" y="168">▦</text><text x="382" y="168">▦</text><text x="554" y="168">▦</text><text x="726" y="168">▦</text><text x="898" y="168">▦</text><text x="1070" y="168">▦</text>
    <text x="210" y="343">▦</text><text x="382" y="343">▦</text><text x="554" y="343">▦</text><text x="726" y="343">▦</text><text x="898" y="343">▦</text><text x="1070" y="343">▦</text>
    <text x="210" y="518">▦</text><text x="382" y="518">▦</text><text x="554" y="518">▦</text><text x="726" y="518">▦</text><text x="898" y="518">▦</text><text x="1070" y="518">▦</text>
  </g>
</svg>
