name: nanofm
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - pytorch-cuda=12.1
  - numpy=1.26.0
  - pandas=2.1.0
  - matplotlib=3.8.0
  - scikit-image=0.22.0
  - scikit-learn=1.3.2
  - pillow=10.1.0
  - tqdm
  - jupyter
  - ipykernel
  - pip:
      - einops==0.7.0
      - safetensors==0.4.1
      - timm==0.9.12
      - omegaconf==2.3.0
      - hydra-core==1.3.2
      - loguru==0.7.2
      - wandb==0.16.0
      - transformers==4.36.0
      - huggingface_hub==0.20.0
      - encodec==0.1.1
      - librosa==0.10.1
      - soundfile==0.12.1
      - mediapy==1.2.0
      - "fourm @ git+https://github.com/apple/ml-4m.git@main#egg=fourm"
      # Editable install of this repo's package:
      - -e .
